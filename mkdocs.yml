site_name: LabelMaster / Potaglab
site_description: Sanitized AWS, CI/CD, PostgreSQL, and SRE portfolio case study
site_url: https://markovskoy.github.io/pack-label-wise-portfolio/

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  features:
    - navigation.footer
  palette:
    - scheme: slate
      primary: indigo
      accent: orange

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Architecture: architecture.md
  - AWS Infrastructure & IaC: aws-infrastructure.md
  - CI/CD: cicd.md
  - Database & Backups: database.md
  - Security: security.md
  - SRE / Operability: sre-operability.md

extra_css:
  - assets/theme.css
