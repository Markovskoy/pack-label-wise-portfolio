site_name: LabelMaster / Potaglab
site_description: Sanitized AWS, CI/CD, PostgreSQL, and SRE portfolio case study
site_url: https://markovskoy.github.io/pack-label-wise-portfolio/

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: orange

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md

extra_css:
  - assets/theme.css
