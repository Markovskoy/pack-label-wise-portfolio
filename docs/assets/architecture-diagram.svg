  <text x="1188" y="488" fill="#5D6B88" font-family="Arial, Helvetica, sans-serif" font-size="21">Optional PPT/PPTX intake</text>
  <text x="1188" y="518" fill="#5D6B88" font-family="Arial, Helvetica, sans-serif" font-size="21">with SES notification flow</text>

