<svg width="1400" height="920" viewBox="0 0 1400 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="700" y1="0" x2="700" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#17213A"/>
    </linearGradient>
    <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6B8CFF"/>
      <stop offset="1" stop-color="#8AB1FF"/>
    </linearGradient>
    <linearGradient id="lineOrange" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFB257"/>
      <stop offset="1" stop-color="#FF9E3D"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1400" height="920" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="920" rx="28" fill="url(#bg)"/>

  <text x="72" y="88" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">LabelMaster / Potaglab</text>
  <text x="72" y="136" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500">Sanitized AWS delivery architecture for the public portfolio repository</text>

  <g filter="url(#shadow)">
    <rect x="72" y="190" width="240" height="120" rx="18" fill="#1E293B" stroke="#334155"/>
    <rect x="368" y="190" width="260" height="120" rx="18" fill="#1E293B" stroke="#334155"/>
    <rect x="688" y="150" width="320" height="200" rx="22" fill="#1E293B" stroke="#334155"/>
    <rect x="1068" y="190" width="260" height="120" rx="18" fill="#1E293B" stroke="#334155"/>

    <rect x="72" y="406" width="260" height="120" rx="18" fill="#1E293B" stroke="#334155"/>
    <rect x="392" y="406" width="236" height="120" rx="18" fill="#1E293B" stroke="#334155"/>
    <rect x="1068" y="406" width="260" height="120" rx="18" fill="#1E293B" stroke="#334155"/>
  </g>

  <text x="108" y="238" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Users</text>
  <text x="108" y="274" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Public access to frontend</text>
  <text x="108" y="300" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">and API domains</text>

  <text x="404" y="238" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Route53 + CloudFront</text>
  <text x="404" y="274" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">DNS, TLS, CDN edge,</text>
  <text x="404" y="300" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">SPA fallback to index.html</text>

  <text x="732" y="212" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">EC2 application host</text>
  <text x="732" y="252" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">API domain resolves here</text>
  <rect x="732" y="282" width="232" height="46" rx="12" fill="#334A80"/>
  <text x="785" y="312" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Caddy reverse proxy</text>
  <rect x="732" y="342" width="250" height="46" rx="12" fill="#4F6DFF"/>
  <text x="787" y="372" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Backend container</text>
  <rect x="732" y="402" width="270" height="46" rx="12" fill="#FF9E3D"/>
  <text x="775" y="432" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">PostgreSQL 16 private</text>

  <text x="1104" y="238" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Lambda + private S3</text>
  <text x="1104" y="274" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Optional upload intake</text>
  <text x="1104" y="300" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">for format source files</text>

  <text x="108" y="454" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">GitHub Actions</text>
  <text x="108" y="490" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Build, release gate, deploy,</text>
  <text x="108" y="516" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">controlled migrations</text>

  <text x="428" y="454" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">S3 frontend bucket</text>
  <text x="428" y="490" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Versioned frontend assets</text>
  <text x="428" y="516" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">for CloudFront delivery</text>

  <text x="1104" y="454" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">S3 backup bucket</text>
  <text x="1104" y="490" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Logical PostgreSQL dumps</text>
  <text x="1104" y="516" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">and restore target</text>

  <path d="M312 250H368" stroke="url(#lineBlue)" stroke-width="6" stroke-linecap="round"/>
  <path d="M628 250H688" stroke="url(#lineBlue)" stroke-width="6" stroke-linecap="round"/>
  <path d="M1008 250H1068" stroke="url(#lineBlue)" stroke-width="6" stroke-linecap="round"/>
  <path d="M202 310V406" stroke="url(#lineBlue)" stroke-width="6" stroke-linecap="round"/>
  <path d="M510 310V406" stroke="url(#lineBlue)" stroke-width="6" stroke-linecap="round"/>
  <path d="M332 466H392" stroke="url(#lineOrange)" stroke-width="6" stroke-linecap="round"/>
  <path d="M628 466H688" stroke="url(#lineOrange)" stroke-width="6" stroke-linecap="round"/>
  <path d="M1008 466H1068" stroke="url(#lineOrange)" stroke-width="6" stroke-linecap="round"/>

  <text x="72" y="612" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Traffic flow</text>
  <text x="72" y="656" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Users -> Route53 -> CloudFront -> S3 frontend</text>
  <text x="72" y="688" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">API domain -> Route53 -> EC2 -> Caddy -> backend container -> PostgreSQL 16</text>
  <text x="72" y="720" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">GitHub Actions -> S3 / CloudFront deploy + SSH backend deploy + controlled migrations</text>
  <text x="72" y="752" fill="#A9B6DE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Backups -> separate S3 backup bucket</text>

  <text x="72" y="838" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500">Sanitized diagram. Real IDs, secrets, private names, and operational identifiers are intentionally omitted.</text>
</svg>
