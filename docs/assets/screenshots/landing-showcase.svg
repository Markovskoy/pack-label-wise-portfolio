<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" rx="28" fill="#F7F9FC"/>
  <rect x="0" y="0" width="1440" height="88" fill="white"/>
  <rect x="52" y="28" width="34" height="34" rx="10" fill="url(#g1)"/>
  <text x="102" y="52" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">Potaglab</text>
  <text x="1200" y="52" fill="#101827" font-family="Arial, Helvetica, sans-serif" font-size="18">Sign in</text>
  <rect x="1310" y="18" width="70" height="50" rx="16" fill="url(#g1)"/>
  <text x="1333" y="50" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Try</text>

  <rect x="0" y="88" width="1440" height="362" fill="url(#hero)"/>
  <circle cx="1224" cy="186" r="126" fill="#6D4BFF" fill-opacity="0.12"/>
  <circle cx="240" cy="198" r="110" fill="#355CFF" fill-opacity="0.11"/>
  <text x="720" y="194" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">Generate marketplace</text>
  <text x="720" y="270" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">labels in minutes</text>
  <text x="720" y="330" text-anchor="middle" fill="#DDE6FF" font-family="Arial, Helvetica, sans-serif" font-size="24">Manage products, create shipments, and export labels with a production-focused workflow.</text>
  <rect x="570" y="380" width="168" height="58" rx="18" fill="url(#g2)"/>
  <text x="654" y="417" text-anchor="middle" fill="#1A2235" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Start now</text>
  <rect x="754" y="380" width="132" height="58" rx="18" fill="#C4CAD8"/>
  <text x="820" y="417" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Sign in</text>

  <text x="720" y="528" text-anchor="middle" fill="#7382A0" font-family="Arial, Helvetica, sans-serif" font-size="20">Supported logistics providers</text>
  <g fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    <text x="355" y="582">LEXON</text>
    <text x="532" y="582">CGETC</text>
    <text x="700" y="582">DHL</text>
    <text x="840" y="582">FedEx</text>
    <text x="998" y="582">Boxberry</text>
  </g>

  <text x="720" y="692" text-anchor="middle" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">Everything for label workflows</text>
  <text x="720" y="742" text-anchor="middle" fill="#7382A0" font-family="Arial, Helvetica, sans-serif" font-size="24">From product import to label export, the full cycle in one app.</text>

  <rect x="144" y="790" width="340" height="182" rx="28" fill="white" stroke="#E5EAF4"/>
  <rect x="190" y="830" width="56" height="56" rx="16" fill="url(#g1)"/>
  <text x="190" y="918" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Product management</text>

  <rect x="550" y="790" width="340" height="182" rx="28" fill="white" stroke="#E5EAF4"/>
  <rect x="596" y="830" width="56" height="56" rx="16" fill="url(#g1)"/>
  <text x="596" y="918" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Smart pallet layout</text>

  <rect x="956" y="790" width="340" height="182" rx="28" fill="white" stroke="#E5EAF4"/>
  <rect x="1002" y="830" width="56" height="56" rx="16" fill="url(#g1)"/>
  <text x="1002" y="918" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Label generation</text>

  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#355CFF"/>
      <stop offset="1" stop-color="#6D4BFF"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB03A"/>
      <stop offset="1" stop-color="#FF871A"/>
    </linearGradient>
    <linearGradient id="hero" x1="95" y1="88" x2="1308" y2="535" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2A44"/>
      <stop offset="0.5" stop-color="#243765"/>
      <stop offset="1" stop-color="#274AA0"/>
    </linearGradient>
